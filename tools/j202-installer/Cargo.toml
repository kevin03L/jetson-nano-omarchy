[package]
name = "j202-installer"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.9.4"
bzip2 = "0.5"
cmac = "0.8.0"
directories = "6.0.0"
eframe = "0.37"
getrandom = "0.4.3"
nusb = "0.2.9"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha-crypt = "0.6.0"
sha2 = "0.11.2"
tar = "0.4"
ureq = { version = "3.5.2", features = ["json"] }
windows = { version = "0.62.2", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
zstd = "0.13"
