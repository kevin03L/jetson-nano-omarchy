# The console on the micro-USB port: agetty opens it itself. Otherwise systemd resets the terminal
# first and, when the host does not read the port, stays in that write with the lock of
# /dev/console: systemd stops for ever the next time it resets a terminal, a session that ends for
# instance, and the watchdog resets the board.
[Service]
ExecStart=
ExecStart=-/usr/bin/agetty --noreset --noclear --keep-baud 115200,57600,38400,9600 %I ${TERM}
StandardInput=null
StandardOutput=journal
TTYPath=
TTYReset=no
TTYVHangup=no
Environment=TERM=vt220
